yolo:
  model_path: weights/best.pt
  conf: 0.25
  imgsz: 640

# -----------------------------------------------------------------------------
# 입력 설정
# -----------------------------------------------------------------------------
# mode:
#   - opencv: 저장 이미지, 저장 영상, /dev/video* 카메라 입력
#   - ros:     ROS2 Image 토픽 입력
#
# rotation:
#   - 90_cw: 입력이 반시계 방향 90도로 누워 있을 때 시계 방향 90도 보정
#   - none:   입력이 이미 정방향이거나 미리 회전해 저장한 경우
#
# 저장된 단일 이미지 테스트
input:
  mode: opencv
  source: datasets/multi_vcb.png
  rotation: none

# # 저장된 영상 테스트
# input:
#   mode: opencv
#   source: datasets/test_video_rotate.mp4
#   rotation: 90_cw

# 물리적으로 반시계 방향 90도 설치된 RealSense의 ROS2 실시간 입력 예시
# input:
#   mode: ros
#   source: /camera/camera/color/image_raw
#   rotation: 90_cw

ocr:
  engine: easyocr
  lang: ['en']
  use_gpu: true

  preprocess:
    resize: 2.0
    grayscale: true

  detection:
    detail: 1
    min_confidence: 0.3

  text_selection:
    method: top_line
    y_weight: 1.0

  refine:
    candidate_threshold: 10
    similarity_threshold:
      candidate: 0.70
      normalized: 0.60

  debug:
    save_crop: false
    save_ocr_text: true

hsv:
  green:
    lower: [25, 20, 20]
    upper: [95, 255, 255]

  red:
    lower1: [0, 40, 40]
    upper1: [10, 255, 255]
    lower2: [170, 40, 40]
    upper2: [180, 255, 255]

  min_color_pixels: 20
  use_morphology: true
  kernel_size: 3

output:
  save_dir: output
  enable_gui: true

  save_video: true
  video_name: result_vcb_rotated.mp4

  save_frames: false
  frames_dir_name: frames

  save_selected_frames: true
  selected_frames_dir_name: selected_frames
  selected_frames: []
  selected_frame_every: 50

  csv_name: result_vcb.csv
  image_name: result_image.jpg